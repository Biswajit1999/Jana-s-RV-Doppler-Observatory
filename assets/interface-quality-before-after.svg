<svg xmlns="http://www.w3.org/2000/svg" width="980" height="626" viewBox="0 0 980 626" role="img" aria-labelledby="title desc">
  <title id="title">Jana RV interface quality rubric before and after version 4.1</title>
  <desc id="desc">Eight declared interface-quality categories improve from a mean of 45.5 to 96.1 out of 100. This is an expert heuristic audit, not a user study.</desc>
