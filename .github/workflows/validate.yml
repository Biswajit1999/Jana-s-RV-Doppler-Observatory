name: Validate RV observatory

on:
  push:
    branches: [rv-validation-v1]
  pull_request:

permissions:
  contents: read

jobs:
  frontend-and-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse browser scripts
        run: |
          for file in app.js app_*.js; do node --check "$file"; done
      - name: Install backend and test dependencies
        run: python -m pip install --upgrade pip -r backend/requirements.txt pytest
      - name: Validate backend RV parser and source boundary
        run: PYTHONPATH=. python -m pytest -q backend/tests
